name: Keep Render services warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Express backend
        run: curl --fail --silent --show-error --max-time 30 https://spot-4n76.onrender.com/health

      - name: Ping simulation engine
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 https://spot-1-7hof.onrender.com/health; then
              exit 0
            fi
            echo "Simulation engine not ready; retry $attempt/5"
            sleep 5
          done
          exit 1
